<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HappyFeet" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>HappyFeet Performance Hub</title>
    <link rel="icon" href="/hf-logo-tp.png" type="image/png" />
    <link rel="apple-touch-icon" href="/hf-logo-tp.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
    />
    <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <!-- Auth screens + app shell: src/react/auth/AuthScreens.jsx, src/react/shell/AppShell.jsx -->
    <div id="app-root"></div>

    <script src="js/config.js"></script>
    <script src="js/dashboards/player.js"></script>
    <script src="js/dashboards/coach.js"></script>
    <script src="js/agent.js"></script>

    <!-- AI AGENT -->
    <button
      class="ai-agent-btn"
      id="ai-agent-btn"
      onclick="HF_AGENT.toggle()"
    >
      <i class="ti ti-ball-football ai-agent-btn-icon"></i>
    </button>

    <div class="ai-agent-panel" id="ai-agent-panel">
      <div class="ai-agent-header">
        <div class="ai-agent-header-row">
          <div class="ai-agent-avatar">
            <i class="ti ti-ball-football ai-agent-avatar-icon"></i>
          </div>
          <div>
            <div class="ai-agent-header-title">DribbleBot</div>
            <div class="ai-agent-header-subtitle">
              Ask me anything football
            </div>
          </div>
        </div>
        <button class="ai-agent-close" onclick="HF_AGENT.toggle()">
          <i class="ti ti-x"></i>
        </button>
      </div>
      <div class="ai-agent-messages" id="ai-agent-messages"></div>
      <div class="ai-agent-input-row">
        <input
          type="text"
          id="ai-agent-input"
          class="ai-agent-input"
          placeholder="Ask about football..."
          onkeydown="if (event.key === 'Enter') HF_AGENT.send();"
        />
        <button class="ai-agent-send-btn" onclick="HF_AGENT.send()">
          <i class="ti ti-send ai-agent-send-icon"></i>
        </button>
      </div>
    </div>

    <script type="module" src="/src/react/mount.jsx"></script>
  </body>
</html>
